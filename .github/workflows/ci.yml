name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Includes the database suite: migrations and RLS run against embedded PostgreSQL (PGlite).
      - run: npm test
      - run: npm run build
        env:
          # The build must not depend on secrets; providers stay unconfigured here.
          ORIVIO_DEMO_MODE: "true"
